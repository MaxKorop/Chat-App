name: CD

# main only changes through pull requests from develop (see pr-source.yml), so this is "develop was released".
# Run it by hand on an older commit to roll back.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # for the OIDC token that AWS exchanges for temporary credentials
  contents: read

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7

      # No long-lived AWS keys in GitHub: the role is assumed through OIDC, for this repository's main branch only.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          for app in api web; do
            docker build -f apps/$app/Dockerfile -t $REGISTRY/chat-app-$app:$TAG -t $REGISTRY/chat-app-$app:latest .
            docker push --all-tags $REGISTRY/chat-app-$app
          done

      - name: Deploy on the EC2 instance through SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sh /opt/chat-app/deploy.sh ${{ github.sha }}"]' \
            --query Command.CommandId --output text)
          echo "CMD_ID=$CMD_ID" >> "$GITHUB_ENV"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"

      - name: Show what the instance printed
        if: always() && env.CMD_ID != ''
        run: |
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status, StandardOutputContent, StandardErrorContent]' --output text
