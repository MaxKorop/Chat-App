pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,mjs,ts,tsx,json,css,md,yml,yaml}'
      run: pnpm oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,mjs,ts,tsx}'
      run: pnpm oxlint {staged_files}
commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
